  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --bg:#06080e; --verde:#22FF99; --azul:#3b9eff; --roxo:#a855f7; --texto:#f4f6fb; --suave:#8e9bb8; }
    html, body { height: 100%; background: var(--bg); color: var(--texto); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
    body { background: radial-gradient(ellipse at 20% 0%, rgba(59,158,255,0.25), transparent 45%), var(--bg); }
    .shell { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; }
    .topo { flex-shrink: 0; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,10,18,0.92); }
    .topo a { color: var(--verde); text-decoration: none; font-size: 13px; }
    .topo h1 { font-family: 'Sora', sans-serif; font-size: 16px; margin-top: 6px; }
    .topo p { font-size: 11.5px; color: var(--suave); margin-top: 2px; }
    .painel { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
    .user-card {

      border-radius: 14px; background: rgba(18,22,34,0.9); border: 1px solid rgba(59,158,255,0.25);

    }
    .user-card .av {
      width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--azul), var(--roxo));
      display: flex; align-items: center; justify-content: center; font-weight: 800;
    }
    .user-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 8px var(--verde); }
    .user-card .nome { font-weight: 700; font-size: 14px; }
    .user-card .meta { font-size: 11px; color: var(--suave); }
    .user-card.tem-nova { border-color: rgba(34,255,153,0.55); box-shadow: 0 0 18px rgba(34,255,153,0.25); }

    .user-card {
      position: relative;
    }
    .btn-apagar-conv {
      flex-shrink: 0;
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid rgba(255,100,100,0.35);
      background: rgba(255,60,60,0.12);
      color: #ff8a8a;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(255,80,80,0.15);
    }
    .btn-apagar-conv:active { background: rgba(255,60,60,0.3); }
    .badge-nova {
      margin-left: 6px; display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px;
      background: linear-gradient(135deg, #22FF99, #3b9eff);
      color: #04140a;
      font-size: 11px; font-weight: 900;
      box-shadow: 0 0 16px rgba(34,255,153,0.75), 0 0 28px rgba(59,158,255,0.4);
      animation: piscaNova 1.2s ease-in-out infinite;
    }
    .user-card.tem-nova {
      border-color: rgba(34,255,153,0.65) !important;
      box-shadow: 0 0 22px rgba(34,255,153,0.35), inset 0 0 20px rgba(34,255,153,0.06);
      background: linear-gradient(135deg, rgba(20,50,45,0.95), rgba(18,22,40,0.95));
    }
    .user-card.tem-nova .nome { color: #22FF99; }

    @keyframes piscaNova {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    .msg {
      max-width: 88%; padding: 10px 12px; border-radius: 16px; margin-bottom: 8px;
      font-size: 14px; line-height: 1.4; position: relative;
    }
    .msg.minha { align-self: flex-end; margin-left: auto; background: linear-gradient(145deg, rgba(20,60,50,0.98), rgba(18,40,55,0.98)); border: 1px solid rgba(34,255,153,0.35); }
    .msg.outra { background: linear-gradient(145deg, rgba(30,40,70,0.95), rgba(24,28,48,0.98)); border: 1px solid rgba(59,158,255,0.35); }
    .msg a.msg-link {
      color: #7dd3fc; text-decoration: underline;
      word-break: break-all; font-weight: 700;
    }
    .msg a.msg-link:active { color: var(--verde); }
    .msg.selecionada { outline: 2px solid rgba(34,255,153,0.5); }
    .msg-hora { font-size: 10px; color: var(--suave); margin-top: 4px; text-align: right; }
    .msg-quote {
      margin-bottom: 6px; padding: 6px 8px; border-radius: 8px; border-left: 3px solid var(--verde);
      background: rgba(0,0,0,0.25); font-size: 12px;

    .msg-quote .q-nome { font-weight: 800; color: var(--verde); font-size: 11px; }
    .msg-quote .q-txt { color: var(--suave); }
    #lista-msgs { display: flex; flex-direction: column; gap: 4px; min-height: 40vh; }
    .composer { flex-shrink: 0; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(8,10,18,0.95); }
    .reply-bar {

    .reply-bar .rb-nome { font-size: 12px; font-weight: 800; color: var(--verde); }
    .reply-bar .rb-msg { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reply-bar .rb-x { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; }
    .composer-row { display: flex; gap: 8px; }
    .composer textarea {
      flex: 1; min-height: 44px; max-height: 100px; resize: none; border-radius: 14px;
      border: 1px solid rgba(59,158,255,0.35); background: rgba(12,14,22,0.95); color: #fff;
      padding: 12px; font-size: 14px; font-family: inherit; outline: none;
    }
    .btn-enviar {

    .vazio { text-align: center; color: var(--suave); padding: 30px 16px; font-size: 13px; line-height: 1.5; }
    .oculto { display: none !important; }
    .btn-voltar-lista { background: none; border: none; color: var(--azul); font-size: 13px; cursor: pointer; margin-bottom: 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);

    .sheet-fundo.mostrar { display: block; }
    .sheet-acoes {
      position: fixed; left: 12px; right: 12px; bottom: 18px; z-index: 301;

    .sheet-acoes.mostrar { transform: translateY(0); }
    .sheet-acoes .sheet-titulo {
      padding: 12px 16px 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em;

    .sheet-acoes button {

      background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.06);

    }
    .sheet-acoes button:last-child { border-bottom: none; color: #ff8a8a; }
    .sheet-acoes button i {
      width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: rgba(59,158,255,0.15); color: var(--azul);
    }
    .edit-modal-fundo {
      display: none; position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
    }
    .edit-modal-fundo.mostrar { display: block; }
    .edit-modal {
      position: fixed; left: 16px; right: 16px; top: 50%; z-index: 401;
      transform: translateY(-50%); max-width: 420px; margin: 0 auto;
      background: linear-gradient(160deg, rgba(30,40,70,0.98), rgba(14,18,32,0.99));
      border: 1px solid rgba(34,255,153,0.4); border-radius: 20px; padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 40px rgba(34,255,153,0.2);
    }
    .edit-modal h3 {
      font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 800; margin-bottom: 12px; text-align: center;
      background: linear-gradient(90deg, var(--verde), var(--azul));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .edit-modal textarea {
      width: 100%; min-height: 90px; border-radius: 14px; border: 1px solid rgba(59,158,255,0.4);
      background: rgba(8,10,18,0.95); color: #fff; padding: 12px; font-size: 14px; font-family: inherit;
    }
    .edit-modal .edit-actions { display: flex; gap: 10px; margin-top: 12px; }
    .edit-modal .edit-actions button {
      flex: 1; border: none; border-radius: 12px; padding: 12px; font-weight: 800; cursor: pointer;
    }
    .btn-cancel-edit { background: rgba(255,255,255,0.08); color: #ccc; }
    .btn-save-edit { background: linear-gradient(90deg, var(--verde), var(--azul)); color: #04140a; }

    .btn-nova-msg {
      display: none; position: absolute; left: 50%; transform: translateX(-50%);
      bottom: 12px; z-index: 40;
      padding: 10px 16px; border-radius: 99px; border: none;
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 12.5px;
      color: #04140a; cursor: pointer;
      background: linear-gradient(90deg, #22FF99, #3b9eff);
      box-shadow: 0 8px 28px rgba(34,255,153,0.45), 0 0 20px rgba(59,158,255,0.25);
      animation: pulseNova 1.5s ease-in-out infinite;
      white-space: nowrap;
    }
    .btn-nova-msg.mostrar { display: inline-flex; align-items: center; gap: 8px; }
    @keyframes pulseNova {
      0%,100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
    }
    #painel-chat { position: relative; }

    .typing-ind {
      display: none; align-items: center; gap: 8px;
      padding: 6px 12px 2px; font-size: 12px; color: var(--suave);
      min-height: 28px;
    }
    .typing-ind.mostrar { display: flex; }
    .typing-ind .dots {
      display: inline-flex; gap: 4px; align-items: center;
      padding: 8px 12px; border-radius: 14px;
      background: rgba(30,40,70,0.9); border: 1px solid rgba(59,158,255,0.3);
    }
    .typing-ind .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--azul);
      animation: typingDot 1.2s ease-in-out infinite;
    }
    .typing-ind .dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-ind .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }
    .typing-ind .typing-nome { font-weight: 700; color: var(--verde); }

    #painel-chat {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #lista-msgs {
      flex: 1 0 auto;
      min-height: min-content;
      padding-bottom: 56px;
    }
    #painel-chat .btn-nova-msg {
      position: sticky;
      bottom: 12px;
      margin: 0 auto 8px;
      left: auto;
      transform: none;
      align-self: center;
    }
    #painel-chat .btn-nova-msg.mostrar {
      display: inline-flex;
    }
    @keyframes pulseNova {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topo">
      <a href="chat.html">← Salas</a>
      <h1 id="titulo">Papo privado</h1>
      <p id="subtitulo">Quem está online e disponível (não a jogar)</p>
    </div>
    <div class="painel" id="painel-lista"></div>
    <div class="painel oculto" id="painel-chat">
      <button type="button" class="btn-voltar-lista" id="btn-voltar">← Voltar à lista</button>
      <p style="font-size:11px;color:#8e9bb8;margin:0 0 8px;text-align:center;">Segura ou toca numa mensagem para responder / editar</p>
      <div id="lista-msgs"></div>
      <button type="button" class="btn-nova-msg" id="btn-nova-msg">↓ Nova mensagem</button>
    </div>
    <div class="typing-ind" id="typing-ind" aria-live="polite">
      <div class="dots"><span></span><span></span><span></span></div>
      <span><span class="typing-nome" id="typing-nome">Alguém</span> está a escrever…</span>
    </div>
    <div class="composer oculto" id="composer">
      <div class="reply-bar" id="reply-bar">
        <div style="flex:1;min-width:0">
          <div class="rb-nome" id="reply-nome">—</div>
          <div class="rb-msg" id="reply-preview">—</div>
        </div>
        <button type="button" class="rb-x" id="reply-cancel">×</button>
      </div>
      <div class="composer-row">
        <textarea id="input-msg" rows="1" maxlength="500" placeholder="Mensagem privada..."></textarea>
        <button type="button" class="btn-enviar" id="btn-enviar"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="sheet-fundo" id="sheet-fundo"></div>
  <div class="sheet-acoes" id="sheet-acoes">
    <div class="sheet-titulo">⚡ Acções da mensagem</div>
    <button type="button" id="sheet-responder"><i class="fas fa-reply"></i> Responder</button>
    <button type="button" id="sheet-copiar"><i class="fas fa-copy"></i> Copiar</button>
    <button type="button" id="sheet-editar" style="display:none;"><i class="fas fa-pen"></i> Editar</button>
    <button type="button" id="sheet-cancelar"><i class="fas fa-times"></i> Cancelar</button>
  </div>
  <div class="edit-modal-fundo" id="edit-modal-fundo">
    <div class="edit-modal">
      <h3>✏️ Editar mensagem</h3>
      <textarea id="edit-textarea" maxlength="500"></textarea>
      <div class="edit-actions">
        <button type="button" class="btn-cancel-edit" id="edit-cancel">Cancelar</button>
        <button type="button" class="btn-save-edit" id="edit-save">Guardar</button>
      </div>
    </div>
  </div>
  <script>
(function () {
  var email = (localStorage.getItem('emailUtilizador') || localStorage.getItem('email') || '').trim().toLowerCase();
  var nomeUser = (localStorage.getItem('nomeUtilizador') || localStorage.getItem('nome') || '').trim();
  if (!nomeUser && email) nomeUser = email.split('@')[0];
  var conversaId = null;
  var parceiro = null;
  var unsub = null;
  var msgsCache = {};
  var replyAlvo = null;
  var msgMenuId = null;
  var editMsgId = null;
  var ONLINE_MS = 3 * 60 * 1000;
  var unsubTyping = null;
  var typingTimer = null;
  var typingStopTimer = null;
  var euEstouAEscrever = false;
  var forcarScrollBaixo = false;
  var ultimoMsgIdVisto = null;
  var ignorarPrimeiroSnap = true;

  /* === Limite diário do chat (protege quota Firebase) === */
  var CHAT_QUOTA_READS = 40000;
  var CHAT_QUOTA_WRITES = 15000;
  var chatQuotaBloqueado = false;

  function diaQuotaId() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function mostrarChatIndisponivel(motivo) {
    chatQuotaBloqueado = true;
    var shell = document.querySelector('.shell') || document.body;
    var box = document.getElementById('dm-chat-quota-block');
    if (!box) {
      box = document.createElement('div');
      box.id = 'dm-chat-quota-block';
      box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,14,0.96);';
      box.innerHTML =
        '<div style="max-width:360px;width:100%;text-align:center;padding:28px 20px;border-radius:22px;' +
        'background:linear-gradient(160deg,rgba(40,28,70,0.98),rgba(14,18,32,0.99));' +
        'border:2px solid rgba(255,201,77,0.45);box-shadow:0 0 40px rgba(255,201,77,0.2)">' +
        '<div style="font-size:42px;margin-bottom:12px;">⏳</div>' +
        '<h2 style="font-family:Sora,sans-serif;font-size:18px;font-weight:800;color:#ffc94d;margin:0 0 10px;">Chat indisponível no momento</h2>' +
        '<p style="font-size:14px;color:#d5dbe8;line-height:1.5;margin:0 0 8px;">Atingimos o limite diário de utilização do bate-papo para proteger o site.</p>' +
        '<p style="font-size:13px;color:#8e9bb8;line-height:1.45;margin:0 0 18px;">' + (motivo || 'Volta amanhã — o chat reabre automaticamente.') + '</p>' +
        '<a href="chat.html" style="display:inline-block;padding:12px 20px;border-radius:14px;font-weight:800;text-decoration:none;color:#04140a;background:linear-gradient(90deg,#22FF99,#3b9eff);">← Voltar às salas</a>' +
        '</div>';
      document.body.appendChild(box);
    }
    box.style.display = 'flex';
    try {
      var composer = document.getElementById('composer');
      if (composer) composer.style.display = 'none';
      var lista = document.getElementById('painel-lista') || document.getElementById('lista-msgs');
      if (lista) lista.style.pointerEvents = 'none';
    } catch (e) {}
  }

  async function verificarQuotaChat() {
    if (!db) return true;
    try {
      var ref = db.collection('sistema').doc('chatQuota');
      var snap = await ref.get();
      var dia = diaQuotaId();
      var d = snap.exists ? (snap.data() || {}) : {};
      if (d.dia !== dia) {
        await ref.set({ dia: dia, reads: 0, writes: 0, updatedAt: new Date().toISOString() }, { merge: true });
        return true;
      }
      var r = parseInt(d.reads, 10) || 0;
      var w = parseInt(d.writes, 10) || 0;
      if (r >= CHAT_QUOTA_READS || w >= CHAT_QUOTA_WRITES) {
        mostrarChatIndisponivel(
          'Leituras: ' + r + '/' + CHAT_QUOTA_READS + ' · Escritas: ' + w + '/' + CHAT_QUOTA_WRITES +
          '. Volta amanhã — o chat reabre automaticamente.'
        );
        return false;
      }
      return true;
    } catch (e) {
      console.warn('quota check', e);
      return true; // se falhar a verificação, não bloqueia o utilizador
    }
  }

  async function incrementarQuotaChat(reads, writes) {
    if (!db || chatQuotaBloqueado) return;
    reads = parseInt(reads, 10) || 0;
    writes = parseInt(writes, 10) || 0;
    if (reads <= 0 && writes <= 0) return;
    try {
      var ref = db.collection('sistema').doc('chatQuota');
      var dia = diaQuotaId();
      await db.runTransaction(async function (tx) {
        var snap = await tx.get(ref);
        var d = snap.exists ? (snap.data() || {}) : {};
        if (d.dia !== dia) {
          tx.set(ref, { dia: dia, reads: reads, writes: writes, updatedAt: new Date().toISOString() }, { merge: true });
          return;
        }
        var nr = (parseInt(d.reads, 10) || 0) + reads;
        var nw = (parseInt(d.writes, 10) || 0) + writes;
        tx.set(ref, { dia: dia, reads: nr, writes: nw, updatedAt: new Date().toISOString() }, { merge: true });
        if (nr >= CHAT_QUOTA_READS || nw >= CHAT_QUOTA_WRITES) {
          chatQuotaBloqueado = true;
        }
      });
      if (chatQuotaBloqueado) {
        mostrarChatIndisponivel('Limite diário atingido. Volta amanhã.');
      }
    } catch (e) {
      // fallback sem transaction
      try {
        var ref2 = db.collection('sistema').doc('chatQuota');
        var s2 = await ref2.get();
        var d2 = s2.exists ? (s2.data() || {}) : {};
        var dia2 = diaQuotaId();
        if (d2.dia !== dia2) {
          await ref2.set({ dia: dia2, reads: reads, writes: writes, updatedAt: new Date().toISOString() }, { merge: true });
        } else {
          await ref2.set({
            dia: dia2,
            reads: (parseInt(d2.reads, 10) || 0) + reads,
            writes: (parseInt(d2.writes, 10) || 0) + writes,
            updatedAt: new Date().toISOString()
          }, { merge: true });
        }
      } catch (e2) { console.warn('quota inc', e2); }
    }
  }


  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  /** Escapa texto e transforma URLs em links clicáveis (abre noutro separador). */
  function formatTextoComLinks(s) {
    var raw = String(s || '');
    var parts = raw.split(/(https?:\/\/[^\s]+|www\.[^\s]+)/gi);
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      if (/^(https?:\/\/|www\.)/i.test(part)) {
        var href = part;
        var trail = '';
        var m = href.match(/([.,;:!?)]+)$/);
        if (m) { trail = m[1]; href = href.slice(0, -trail.length); }
        if (/^www\./i.test(href)) href = 'https://' + href;
        out += '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" class="msg-link">' + esc(href) + '</a>' + esc(trail);
      } else {
        out += esc(part).replace(/\n/g, '<br>');
      }
    }
    return out;
  }

  function idConversa(a, b) {

  function soNome(n, em) {
    n = String(n || '').trim();
    if (n && n.indexOf('@') === -1) return n;
    em = String(em || '').trim();
    if (em.indexOf('@desafiomoz.internal') !== -1) {
      // dica.mariojoao@... → Mariojoao
      var local = em.split('@')[0].replace(/^dica\./, '');
      return local.charAt(0).toUpperCase() + local.slice(1);
    }
    if (em.indexOf('@') !== -1) return em.split('@')[0];
    return 'Membro';
  }
  function formatHora(iso) {
    try {
      var d = iso && iso.toDate ? iso.toDate() : new Date(iso);
      if (isNaN(d.getTime())) return '';
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    } catch (e) { return ''; }
  }

      });

  async function apagarConversaCompleta(convId) {

    try {
      toast('A apagar…');

      for (var voltas = 0; voltas < 20; voltas++) {
        var snap = await db.collection('chatPrivado').where('conversaId', '==', convId).limit(400).get();
        if (snap.empty) break;
        var batch = db.batch();
        snap.forEach(function (doc) { batch.delete(doc.ref); });
        await batch.commit();
        if (snap.size < 400) break;
      }
      await db.collection('chatPrivadoConversas').doc(convId).delete();
      try {
        var lidos = JSON.parse(localStorage.getItem('dmPrivadoLido') || '{}');

  function tempoMsgMs(v) {

  /** Conta mensagens do outro que chegaram depois da última vez que abriste a conversa */
  async function contarNaoLidasReal(convId, meuEmail, lidoEmIso) {
    if (!db || !convId) return 0;
    try {
      var snap = await db.collection('chatPrivado').where('conversaId', '==', convId).get();
      var meu = String(meuEmail).toLowerCase();
      var limite = lidoEmIso ? new Date(lidoEmIso).getTime() : 0;
      if (lidoEmIso && isNaN(limite)) limite = 0;
      var n = 0;
      snap.forEach(function (doc) {
        var d = doc.data() || {};
        if (String(d.deEmail || '').toLowerCase() === meu) return;
        var t = tempoMsgMs(d.createdAt);
        // Se nunca abriu (sem lidoEm), conta todas as do outro
        if (!limite || t > limite) n++;
      });
      return n;
    } catch (e) {
      console.warn('contarNaoLidas', e);
      return 0;
    }
  }

  async function gravarNaoLidasEnvio(convId, meuEmail, parceiroEmail, meta) {
    var ref = db.collection('chatPrivadoConversas').doc(convId);
    try {
      var snap = await ref.get();
      var data = snap.exists ? (snap.data() || {}) : {};
      var nl = Object.assign({}, data.naoLidas || {});
      var eu = String(meuEmail).toLowerCase();
      var outro = String(parceiroEmail).toLowerCase();
      nl[outro] = (parseInt(nl[outro], 10) || 0) + 1;
      nl[eu] = 0;
      var payload = Object.assign({}, meta || {}, { naoLidas: nl });
      await ref.set(payload, { merge: true });
    } catch (e) {
      console.warn('gravarNaoLidas', e);
      // fallback mínimo
      try {
        await ref.set(meta || {}, { merge: true });
      } catch (e2) {}
    }
  }

              return Math.max(n, qtdDoc);
            });
          }));
          convs.forEach(function (c, idx) {

              '</div>' +

              '<button type="button" class="btn-apagar-conv" data-apagar-conv="' + esc(c.id) + '" title="Apagar conversa"><i class="fas fa-trash"></i></button>' +
              '</div>';
          });
        }
      } catch (e2) { console.warn('convs', e2); }

      var html = convHtml;
      html += '<p style="font-size:12px;color:#8e9bb8;margin:12px 0 8px;">Online e disponível</p>';
      if (!lista.length) {
        html += '<div class="vazio">Ninguém disponível neste momento.<br>Quem está a jogar não aparece aqui.</div>';
      } else {
        lista.forEach(function (u) {
          html += '<div class="user-card" data-email="' + esc(u.email) + '" data-nome="' + esc(u.nome) + '">' +
            '<div class="av">' + esc(u.nome.charAt(0).toUpperCase()) + '</div>' +
            '<div style="flex:1"><div class="nome">' + esc(u.nome) + ' <span class="dot" style="display:inline-block;vertical-align:middle;margin-left:4px;"></span></div>' +
            '<div class="meta">Em: ' + esc(u.pagina) + '</div></div></div>';
        });
      }
      host.innerHTML = html;
      host.querySelectorAll('.user-card').forEach(function (el) {
        el.addEventListener('click', function (ev) {
          if (ev.target && (ev.target.closest && ev.target.closest('.btn-apagar-conv'))) return;
          abrirChat(el.getAttribute('data-email'), el.getAttribute('data-nome'));
        });

      host.querySelectorAll('.btn-apagar-conv').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {

    } catch (e) {
      console.error(e);
      host.innerHTML = '<div class="vazio">Erro ao carregar. Tenta de novo.</div>';
    }

  function msgTimeMs(v) {
    if (!v) return 0;
    try {
      if (v.toDate) return v.toDate().getTime();
      if (typeof v === 'number') return v;

  function ordenarIdsMsgs(ids) {

      var db = msgsCache[b] || {};
      var ta = msgTimeMs(da.createdAt);
      var tb = msgTimeMs(db.createdAt);
      if (ta !== tb) return ta - tb;
      // local_ always after same-time server if needed; prefer stable id
      return String(a).localeCompare(String(b));

      var updMark = (snapC.exists && snapC.data().updatedAt) ? snapC.data().updatedAt : new Date().toISOString();
      var agoraLido = new Date().toISOString();
      var resetNL = {
        participantes: [String(email).toLowerCase(), String(parceiro.email).toLowerCase()].sort(),
        nomes: nomes,
        naoLidas: (function () {
          // mantém o mapa e zera só o meu
          return {};
        })()
      };
      // lê actual para não apagar as não-lidas do outro
      try {
        var snapNL = await db.collection('chatPrivadoConversas').doc(conversaId).get();
        var prev = snapNL.exists ? (snapNL.data() || {}) : {};
        var nl = Object.assign({}, prev.naoLidas || {});
        nl[String(email).toLowerCase()] = 0;

        le[String(email).toLowerCase()] = agoraLido;

      } catch (eNL) {

        resetNL.naoLidas[String(email).toLowerCase()] = 0;
        resetNL.lidoEm = {};
        resetNL.lidoEm[String(email).toLowerCase()] = agoraLido;
      }
      await db.collection('chatPrivadoConversas').doc(conversaId).set(resetNL, { merge: true });
      try {
        var lidos2 = JSON.parse(localStorage.getItem('dmPrivadoLido') || '{}');
        lidos2[conversaId] = updMark;
        localStorage.setItem('dmPrivadoLido', JSON.stringify(lidos2));
      } catch (eR2) {}
    } catch (e) {}

    if (unsub) try { unsub(); } catch (e) {}
    // Query simples (só conversaId) — tempo real rápido, sem índice composto
    unsub = db.collection('chatPrivado')
      .where('conversaId', '==', conversaId)
      .onSnapshot({ includeMetadataChanges: true }, function (snap) {
        try {
          var nDocs = snap.size || 0;
          if (nDocs > 0) incrementarQuotaChat(nDocs, 0);
          if (chatQuotaBloqueado) return;
        } catch (eQ) {}
        var vindos = {};
        snap.forEach(function (doc) {
          var d = doc.data() || {};
          // normaliza createdAt para string comparável
          if (d.createdAt && d.createdAt.toDate) {
            try { d.createdAt = d.createdAt.toDate().toISOString(); } catch (e) {}
          }
          d._local = !!(doc.metadata && doc.metadata.hasPendingWrites);
          vindos[doc.id] = d;
        });
        // Remove temporários locais já confirmados no servidor
        Object.keys(msgsCache).forEach(function (id) {
          if (String(id).indexOf('local_') === 0) {
            var L = msgsCache[id];
            var match = false;
            Object.keys(vindos).forEach(function (rid) {
              var R = vindos[rid];
              if (String(R.texto || '') === String(L.texto || '') &&
                  String(R.deEmail || '').toLowerCase() === String(L.deEmail || '').toLowerCase()) {
                match = true;
              }
            });
            if (match) delete msgsCache[id];
          } else if (!vindos[id]) {
            delete msgsCache[id];
          }
        });
        Object.keys(vindos).forEach(function (id) { msgsCache[id] = vindos[id]; });
        renderMsgs();
      }, function (err) {
        console.error('listener privado', err);
        toast('Erro ao ouvir mensagens. Tenta reabrir o chat.');
      });
  }

  async function enviar() {
    if (chatQuotaBloqueado) { toast('Chat indisponível — volta amanhã.'); return; }
    var ta = document.getElementById('input-msg');
    var texto = (ta.value || '').trim().slice(0, 500);
    if (!texto || !conversaId || !parceiro) return;
    var btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    pararTypingEu();
    var agora = new Date().toISOString();
    var tempId = 'local_' + Date.now();
    var payload = {
      conversaId: conversaId,
      participantes: [String(email).toLowerCase(), String(parceiro.email).toLowerCase()].sort(),
      deEmail: String(email).toLowerCase(),
      deNome: nomeUser,
      texto: texto,
      createdAt: agora,
      _local: true
    };
    if (replyAlvo) {
      payload.replyNome = replyAlvo.nome;
      payload.replyTexto = (replyAlvo.texto || '').slice(0, 200);
      payload.replyId = replyAlvo.id;
    }
    forcarScrollBaixo = true;
    msgsCache[tempId] = payload;
    renderMsgs();
    ta.value = '';
    var replyGuardado = replyAlvo;
    replyAlvo = null;
    document.getElementById('reply-bar').classList.remove('mostrar');

    try {
      var dataFire = {
        conversaId: conversaId,
        participantes: [String(email).toLowerCase(), String(parceiro.email).toLowerCase()].sort(),
        deEmail: String(email).toLowerCase(),
        deNome: nomeUser,
        texto: texto,
        createdAt: agora
      };
      if (replyGuardado) {
        dataFire.replyNome = replyGuardado.nome;
        dataFire.replyTexto = (replyGuardado.texto || '').slice(0, 200);
        dataFire.replyId = replyGuardado.id;
      }
      // Envia já — o outro vê no onSnapshot em tempo real
      var ref = await db.collection('chatPrivado').add(dataFire);
      delete msgsCache[tempId];
      payload._local = false;
      payload.createdAt = agora;
      msgsCache[ref.id] = payload;
      renderMsgs();
      // Actualizações secundárias em paralelo (não atrasam a mensagem)
      var metaConv = {
        participantes: [String(email).toLowerCase(), String(parceiro.email).toLowerCase()].sort(),
        ultimaMsg: texto.slice(0, 80),
        ultimaDeEmail: String(email).toLowerCase(),
        updatedAt: agora,
        nomes: (function () {
          var n = {};
          n[String(email).toLowerCase()] = nomeUser;
          n[String(parceiro.email).toLowerCase()] = parceiro.nome;
          return n;
        })()
      };
      incrementarQuotaChat(0, 3); // msg + conversa + notificação
      Promise.all([
        gravarNaoLidasEnvio(conversaId, email, parceiro.email, metaConv),
        db.collection('notificacoesChat').add({
          email: String(parceiro.email).toLowerCase(),
          tipo: 'privado',
          deNome: nomeUser,
          deEmail: String(email).toLowerCase(),
          texto: texto.slice(0, 120),
          conversaId: conversaId,
          lida: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function (eN) { console.warn('notif privado', eN); })
      ]).catch(function (e2) { console.warn('pos-envio', e2); });
    } catch (e) {
      console.error(e);
      delete msgsCache[tempId];
      renderMsgs();
      toast('Falha ao enviar');
    } finally {
      btn.disabled = false;
      // Fecha o teclado até o utilizador tocar de novo no campo
      try { ta.blur(); } catch (e) {}
      try { document.activeElement && document.activeElement.blur(); } catch (e2) {}
    }
  }

  document.getElementById('btn-enviar').addEventListener('click', enviar);
  var btnNova = document.getElementById('btn-nova-msg');
  if (btnNova) btnNova.addEventListener('click', irParaUltimaMsg);
  (function () {
    var el = getScrollEl();
    if (!el) return;
    el.addEventListener('scroll', function () {
      if (estaNoFundo(el)) {
        mostrarBtnNovaMsg(false);
        var ids = ordenarIdsMsgs(Object.keys(msgsCache));
        if (ids.length) ultimoMsgIdVisto = ids[ids.length - 1];
      }
    }, { passive: true });
  })();

  document.getElementById('input-msg').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
  });
  document.getElementById('input-msg').addEventListener('input', function () {
    var v = (this.value || '').trim();
    if (v) sinalizarTypingEu();
    else pararTypingEu();
  });
  document.getElementById('btn-voltar').addEventListener('click', function () {
    pararTypingEu();
    if (unsubTyping) { try { unsubTyping(); } catch (e) {} unsubTyping = null; }
    esconderTyping();
    if (unsub) try { unsub(); } catch (e) {}
    conversaId = null; parceiro = null; msgsCache = {};
    document.getElementById('painel-chat').classList.add('oculto');
    document.getElementById('composer').classList.add('oculto');
    document.getElementById('painel-lista').classList.remove('oculto');
    document.getElementById('titulo').textContent = 'Papo privado';
    document.getElementById('subtitulo').textContent = 'Quem está online e disponível (não a jogar)';
    carregarOnline();
  });

  document.getElementById('sheet-fundo').addEventListener('click', fecharMenu);
  document.getElementById('sheet-cancelar').addEventListener('click', fecharMenu);
  document.getElementById('sheet-responder').addEventListener('click', function () {
    var d = msgMenuId && msgsCache[msgMenuId];
    if (d) {
      replyAlvo = { id: msgMenuId, nome: soNome(d.deNome, d.deEmail), texto: d.texto || '' };
      document.getElementById('reply-nome').textContent = 'A responder a ' + replyAlvo.nome;
      document.getElementById('reply-preview').textContent = (replyAlvo.texto || '').slice(0, 80);
      document.getElementById('reply-bar').classList.add('mostrar');
      document.getElementById('input-msg').focus();
    }
    fecharMenu();
  });
  document.getElementById('reply-cancel').addEventListener('click', function () {
    replyAlvo = null;
    document.getElementById('reply-bar').classList.remove('mostrar');
  });
  document.getElementById('sheet-copiar').addEventListener('click', function () {
    var d = msgMenuId && msgsCache[msgMenuId];
    if (d && d.texto) {
      try { navigator.clipboard.writeText(String(d.texto)).then(function () { toast('Copiado!'); }); }
      catch (e) { toast('Não foi possível copiar'); }
    }
    fecharMenu();
  });
  document.getElementById('sheet-editar').addEventListener('click', function () {
    var d = msgMenuId && msgsCache[msgMenuId];
    if (!d || !msgMenuId) { fecharMenu(); return; }
    editMsgId = msgMenuId;
    document.getElementById('edit-textarea').value = d.texto || '';
    fecharMenu();
    document.getElementById('edit-modal-fundo').classList.add('mostrar');
  });
  document.getElementById('edit-cancel').addEventListener('click', function () {
    editMsgId = null;
    document.getElementById('edit-modal-fundo').classList.remove('mostrar');
  });
  document.getElementById('edit-modal-fundo').addEventListener('click', function (e) {
    if (e.target === this) {
      editMsgId = null;
      document.getElementById('edit-modal-fundo').classList.remove('mostrar');
    }
  });
  document.getElementById('edit-save').addEventListener('click', function () {
    if (!editMsgId) return;
    var novo = String(document.getElementById('edit-textarea').value || '').trim().slice(0, 500);
    if (!novo) { toast('Mensagem vazia'); return; }
    var id = editMsgId;
    if (msgsCache[id]) {
      msgsCache[id].texto = novo;
      msgsCache[id].editado = true;
    }
    document.getElementById('edit-modal-fundo').classList.remove('mostrar');
    editMsgId = null;
    renderMsgs();
    toast('Mensagem editada ✨');
    db.collection('chatPrivado').doc(id).update({
      texto: novo,
      editado: true,
      editadoEm: new Date().toISOString()
    }).then(function () {
      /* ok */
    }).catch(function (err) {
      console.warn('update edit', err);
      db.collection('chatPrivado').doc(id).set({
        texto: novo,
        editado: true,
        editadoEm: new Date().toISOString()
      }, { merge: true }).catch(function (e2) {
        toast('Não foi possível guardar a edição. Verifica as regras Firebase.');
        console.error(e2);
      });
    });
  });

  var params = new URLSearchParams(location.search);
  var com = (params.get('com') || '').toLowerCase();
  var nomeUrl = params.get('nome') || '';
  if (!com) {
    try {
      var a = JSON.parse(localStorage.getItem('dmPrivadoAlvo') || 'null');
      if (a && a.email) {
        com = String(a.email).toLowerCase();
        nomeUrl = a.nome || '';
        localStorage.removeItem('dmPrivadoAlvo');
      }
    } catch (e) {}
  }

  verificarQuotaChat().then(function (ok) {
    if (!ok) return;
    limparAntigas().then(function () {
      if (com && email) {
        abrirChat(com, nomeUrl || soNome('', com));
      } else {
        carregarOnline();
      }
    });
  });
})();
  </script>
