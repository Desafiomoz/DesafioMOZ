<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Conta – Desafio MOZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0a0a0f; color: #fff; min-height: 100vh; padding-bottom: 90px; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; background: rgba(10,10,15,0.97);
            border-bottom: 2px solid #00c853; position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo {
            width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
            border: 2px solid #00e676; background: rgba(0,200,83,0.15);
        }
        .app-title { font-size: 20px; font-weight: 700; color: #00e676; }

        .content { padding: 16px; max-width: 480px; margin: 0 auto; }

        .hero {
            background: linear-gradient(160deg, rgba(0,200,83,0.18), rgba(21,21,31,0.95));
            border: 1px solid rgba(0,200,83,0.3);
            border-radius: 20px; padding: 24px 18px 20px; text-align: center; margin-bottom: 14px;
        }
        .avatar {
            width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
            margin: 0 auto 12px; display: block; border: 3px solid #00e676;
            box-shadow: 0 0 18px rgba(0,200,83,0.35); background: rgba(0,200,83,0.12);
        }
        .nome-usuario { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .email-usuario { font-size: 13px; color: #888; margin-bottom: 14px; word-break: break-all; }

        .saldo-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .saldo-box {
            background: rgba(10,10,15,0.7); border: 1px solid rgba(0,200,83,0.25);
            border-radius: 14px; padding: 12px 10px;
        }
        .saldo-box .lbl { font-size: 11px; color: #888; margin-bottom: 4px; }
        .saldo-box .num { font-size: 20px; font-weight: 800; color: #FFD700; }
        .saldo-box .num.mzn { color: #00e676; }

        .card {
            background: rgba(21,21,31,0.95);
            border: 1px solid rgba(0,200,83,0.22);
            border-radius: 16px; padding: 16px; margin-bottom: 14px;
        }
        .card h3 {
            font-size: 14px; color: #00e676; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 14px; gap: 10px;
        }
        .info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .info-row:first-child { padding-top: 0; }
        .info-row .lbl { color: #888; flex-shrink: 0; }
        .info-row .val { font-weight: 600; color: #eee; text-align: right; word-break: break-all; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
        }
        .stat {
            background: rgba(10,10,15,0.6); border-radius: 12px;
            padding: 12px 8px; text-align: center; border: 1px solid rgba(0,200,83,0.15);
        }
        .stat .n { font-size: 18px; font-weight: 800; color: #00e676; }
        .stat .t { font-size: 10px; color: #888; margin-top: 3px; }

        .saque-item {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); gap: 10px;
        }
        .saque-item:last-child { border-bottom: none; padding-bottom: 0; }
        .saque-item:first-child { padding-top: 0; }
        .saque-item .esq { flex: 1; min-width: 0; }
        .saque-item .valor { font-weight: 700; font-size: 15px; color: #eee; }
        .saque-item .meta { font-size: 12px; color: #777; margin-top: 3px; }
        .tag {
            font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px;
            white-space: nowrap; flex-shrink: 0;
        }
        .tag-pendente { background: rgba(255,193,7,0.15); color: #ffc107; }
        .tag-pago { background: rgba(0,200,83,0.15); color: #00e676; }
        .tag-recusado { background: rgba(239,83,80,0.15); color: #ef5350; }

        .vazio { text-align: center; padding: 18px 8px; color: #666; font-size: 13px; }

        .links-uteis {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
        }
        .link-card {
            background: rgba(21,21,31,0.95); border: 1px solid rgba(0,200,83,0.22);
            border-radius: 14px; padding: 14px 12px; text-decoration: none; color: #fff;
            display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
        }
        .link-card i { font-size: 18px; color: #00e676; }
        .link-card span { font-size: 12px; font-weight: 600; color: #ccc; }

        .btn-sair {
            width: 100%; background: rgba(239,83,80,0.12); color: #ef5350;
            border: 1px solid rgba(239,83,80,0.35); border-radius: 14px;
            padding: 14px; font-size: 15px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; margin-top: 4px;
        }
        .btn-sair:active { opacity: 0.85; }

        .menu-baixo {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(12,12,18,0.97); border-top: 1px solid #1e1e2a;
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 12px; z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .menu-baixo a {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            text-decoration: none; color: #777; font-size: 11px; font-weight: 500; width: 70px;
        }
        .menu-baixo a i { font-size: 20px; margin-bottom: 2px; }
        .menu-baixo a.ativo { color: #00e676; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <img src="https://i.supaimg.com/b173afd9-4344-4026-a5d7-6a53e4b6efdc/8f054a24-2746-4a43-9f1c-354584289dc3.png" alt="Logo" class="logo">
            <div class="app-title">Desafio MOZ</div>
        </div>
    </div>

    <div class="content">

        <div class="hero">
            <img src="https://i.supaimg.com/b173afd9-4344-4026-a5d7-6a53e4b6efdc/8f054a24-2746-4a43-9f1c-354584289dc3.png" alt="Avatar" class="avatar" id="avatar">
            <div class="nome-usuario" id="nome">—</div>
            <div class="email-usuario" id="email">—</div>
            <div class="saldo-row">
                <div class="saldo-box">
                    <div class="lbl">Pontos</div>
                    <div class="num" id="pontos-txt">0</div>
                </div>
                <div class="saldo-box">
                    <div class="lbl">Em meticais</div>
                    <div class="num mzn" id="mzn-txt">0 MZN</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-id-card"></i> Dados da conta</h3>
            <div class="info-row">
                <span class="lbl">ID</span>
                <span class="val" id="user-id">—</span>
            </div>
            <div class="info-row">
                <span class="lbl">Telemóvel</span>
                <span class="val" id="telefone">—</span>
            </div>
            <div class="info-row">
                <span class="lbl">E-mail</span>
                <span class="val" id="email-info">—</span>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-chart-line"></i> Resumo de actividade</h3>
            <div class="stats-grid">
                <div class="stat">
                    <div class="n" id="stat-convidados">0</div>
                    <div class="t">Convites</div>
                </div>
                <div class="stat">
                    <div class="n" id="stat-indicacao">0</div>
                    <div class="t">Pts indicação</div>
                </div>
                <div class="stat">
                    <div class="n" id="stat-saques">0</div>
                    <div class="t">Saques</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-wallet"></i> Saques feitos</h3>
            <div id="lista-saques">
                <div class="vazio">A carregar...</div>
            </div>
        </div>

        <div class="links-uteis">
            <a class="link-card" href="saques.html">
                <i class="fas fa-money-bill-wave"></i>
                <span>Pedir saque</span>
            </a>
            <a class="link-card" href="convidar.html">
                <i class="fas fa-user-plus"></i>
                <span>Convidar</span>
            </a>
            <a class="link-card" href="checkin.html">
                <i class="fas fa-calendar-check"></i>
                <span>Check-in</span>
            </a>
            <a class="link-card" href="Regras.html">
                <i class="fas fa-scroll"></i>
                <span>Regras</span>
            </a>
        </div>

        <button class="btn-sair" type="button" onclick="sairDaConta()">
            <i class="fas fa-sign-out-alt"></i> Sair da conta
        </button>

    </div>

    <div class="menu-baixo">
        <a href="desafios.html"><i class="fas fa-home"></i> Início</a>
        <a href="tarefas.html"><i class="fas fa-tasks"></i> Tarefas</a>
        <a href="saques.html"><i class="fas fa-wallet"></i> Sacar</a>
        <a href="perfil.html" class="ativo"><i class="fas fa-cog"></i> Conta</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script>
        if (typeof window.__DESAFIO_MOZ_FIREBASE__ === 'undefined') {
            window.__DESAFIO_MOZ_FIREBASE__ = true;
            var firebaseConfig = {
                apiKey: "AIzaSyDONfggnmf9OJX_AgfvcHTRf6tsuKD5nrA",
                authDomain: "desafio-moz-61b70.firebaseapp.com",
                projectId: "desafio-moz-61b70",
                storageBucket: "desafio-moz-61b70.firebasestorage.app",
                messagingSenderId: "945658936331",
                appId: "1:945658936331:web:7ee4b0e7de1c1daf36db0e",
                measurementId: "G-G1DZQ1B0DB"
            };
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            window.db = firebase.firestore();
        }
        var db = window.db;

        function hashCode(str) {
            var hash = 0;
            for (var i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        function formatarData(iso) {
            if (!iso) return '';
            try {
                var d = new Date(iso);
                if (isNaN(d.getTime())) return String(iso).substring(0, 16);
                return String(d.getDate()).padStart(2, '0') + '/' +
                       String(d.getMonth() + 1).padStart(2, '0') + '/' +
                       d.getFullYear();
            } catch (e) { return ''; }
        }

        function tagStatus(status) {
            if (status === 'pago') return '<span class="tag tag-pago">Pago</span>';
            if (status === 'recusado') return '<span class="tag tag-recusado">Recusado</span>';
            return '<span class="tag tag-pendente">Pendente</span>';
        }

        async function carregarSaques(email) {
            var host = document.getElementById('lista-saques');
            if (!email || email === '—') {
                host.innerHTML = '<div class="vazio">Nenhum saque ainda</div>';
                return;
            }
            try {
                var lista = [];
                var emails = [email];
                var emailNorm = String(email).trim().toLowerCase();
                if (emailNorm !== email) emails.push(emailNorm);

                for (var i = 0; i < emails.length; i++) {
                    var snap = await db.collection('solicitacoesSaque').where('email', '==', emails[i]).get();
                    snap.forEach(function (doc) {
                        var d = doc.data();
                        d._id = doc.id;
                        if (!lista.some(function (x) { return x._id === d._id; })) lista.push(d);
                    });
                }

                lista.sort(function (a, b) {
                    return String(b.dataPedido || '').localeCompare(String(a.dataPedido || ''));
                });

                document.getElementById('stat-saques').textContent = lista.length;

                if (!lista.length) {
                    host.innerHTML = '<div class="vazio">Nenhum saque ainda</div>';
                    return;
                }

                var html = '';
                lista.forEach(function (s) {
                    var valor = s.liquidoMZN != null
                        ? Number(s.liquidoMZN).toFixed(2)
                        : (s.valorMZN != null ? Number(s.valorMZN).toFixed(2) : ((s.pontos || 0) / 10).toFixed(2));
                    var pts = s.pontos || 0;
                    var metodo = s.metodo || '';
                    var dataStr = formatarData(s.dataPedido);
                    var status = s.status || 'pendente';
                    html +=
                        '<div class="saque-item">' +
                          '<div class="esq">' +
                            '<div class="valor">' + valor + ' MZN</div>' +
                            '<div class="meta">' + pts + ' pts' +
                              (metodo ? ' · ' + metodo : '') +
                              (dataStr ? ' · ' + dataStr : '') +
                            '</div>' +
                          '</div>' +
                          tagStatus(status) +
                        '</div>';
                });
                host.innerHTML = html;
            } catch (e) {
                console.warn('Saques:', e);
                host.innerHTML = '<div class="vazio">Não foi possível carregar</div>';
            }
        }

        async function carregarPontosFirebase(email) {
            if (!email || email === '—') return null;
            try {
                var snap = await db.collection('usuarios').where('email', '==', email).limit(1).get();
                if (snap.empty) {
                    var emailNorm = String(email).trim().toLowerCase();
                    if (emailNorm !== email) {
                        snap = await db.collection('usuarios').where('email', '==', emailNorm).limit(1).get();
                    }
                }
                if (!snap.empty) return snap.docs[0].data();
            } catch (e) { console.warn('Perfil Firebase:', e); }
            return null;
        }

        function sairDaConta() {
            if (!confirm('Tem a certeza que deseja sair da conta?')) return;
            ['nomeUtilizador','telUtilizador','emailUtilizador','userId','ultimoSaque','fotoPerfil','pontosUtilizador','codigoIndicacao'].forEach(function (k) {
                localStorage.removeItem(k);
            });
            window.location.href = 'criar-conta.html';
        }

        document.addEventListener('DOMContentLoaded', async function () {
            var nome = localStorage.getItem('nomeUtilizador') || '—';
            var tel = localStorage.getItem('telUtilizador') || '—';
            var email = localStorage.getItem('emailUtilizador') || '—';
            var userId = localStorage.getItem('userId');
            var fotoPerfil = localStorage.getItem('fotoPerfil');
            var pontos = parseInt(localStorage.getItem('pontosUtilizador') || '0', 10);

            if (!userId && email && email !== '—') {
                userId = 'USR-' + Math.abs(hashCode(email)).toString().substring(0, 6);
                localStorage.setItem('userId', userId);
            }

            document.getElementById('nome').textContent = nome;
            document.getElementById('email').textContent = email;
            document.getElementById('email-info').textContent = email;
            document.getElementById('telefone').textContent = tel;
            document.getElementById('user-id').textContent = userId || '—';
            document.getElementById('pontos-txt').textContent = pontos;
            document.getElementById('mzn-txt').textContent = (pontos / 10).toFixed(1) + ' MZN';
            if (fotoPerfil) document.getElementById('avatar').src = fotoPerfil;

            if (email && email !== '—') {
                var dados = await carregarPontosFirebase(email);
                if (dados) {
                    if (dados.nome) document.getElementById('nome').textContent = dados.nome;
                    if (dados.telemovel) document.getElementById('telefone').textContent = dados.telemovel;
                    if (dados.pontos != null) {
                        pontos = dados.pontos;
                        localStorage.setItem('pontosUtilizador', String(pontos));
                        document.getElementById('pontos-txt').textContent = pontos;
                        document.getElementById('mzn-txt').textContent = (pontos / 10).toFixed(1) + ' MZN';
                    }
                    document.getElementById('stat-convidados').textContent = dados.totalConvidados || 0;
                    document.getElementById('stat-indicacao').textContent = dados.pontosIndicacao || 0;
                }
                await carregarSaques(email);
            } else {
                document.getElementById('lista-saques').innerHTML = '<div class="vazio">Nenhum saque ainda</div>';
            }
        });
    </script>
</body>
</html>
