/* Combustível, perfil e regras de perda */
var FMAX=4;

function fuelTick(){if(P.lock&&Date.now()>=P.lock){P.fuel=FMAX;P.lock=0;sv()}}

  var ii=ov.querySelector('.tk i');if(ii){var pc=Math.max(0,P.fuel)/FMAX*100;setTimeout(function(){ii.style.height=pc+'%'},250)}

function start(){fuelTick();if(P.fuel<=0&&P.lock>Date.now()){lockScr();return}S.pz=false;c1='';c2='';c3=-1;build(S.lv);bodyM.color.setHex(PAL[P.skin][0]);S.play=true;ov.className='h';save();$('fk').innerHTML=tank();flash((S.lv<=15?'Apanha 6 ✦ para o TURBO · ':'')+'Meta em '+Math.ceil(S.t)+' s',2600)}
function oldEnd(win){
  S.play=false;var last=S.lv>=MAXL,gain=(win?50+Math.floor(S.lv*.4):0)+S.orbs*(win?10:5),st=0;P.coins+=gain;P.orbs=(P.orbs||0)+S.orbs*(P.x2?2:1);if(win){var r0=S.t/TR.time;st=r0>=.3?3:r0>=.12?2:1;var dn=P.dn||'0'.repeat(MAXL),o0=+dn.charAt(S.lv-1)||0;if(st>o0)P.dn=dn.substring(0,S.lv-1)+st+dn.substring(S.lv)}sv();

}
ov.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){S.lv=parseInt(b.dataset.l);start()}else if(b.dataset.w){S.wi=parseInt(b.dataset.w);levels()}else if(b.dataset.a=='play'){S.wi=null;levels()}else if(b.dataset.a=='back')menu(true)
  else if(b.dataset.a=='go')start();else if(b.dataset.a=='menu'){S.wi=null;levels()}});
window.addEventListener('keydown',function(e){var k=e.key;

  if((k=='Enter'||k==' ')&&!S.play)start()});

function tp(e){if(P.ctl!=3||S.pz||e.target.closest('#hb,#pd,#ib'))return;var W=window.innerWidth,v=(e.clientX-W/2)/(W*.3);tch=Math.abs(v)<.06?0:(v<0?-1:1)*Math.min(1,Math.max(.55,Math.abs(v)))}

function step(dt){
  if(!S.play||S.pz)return;
  var inp=Math.max(-1,Math.min(1,keys.r-keys.l+tch+CI)),p=pose(S.s);
  if(S.tb>0)S.tb-=dt;if(S.sp>0)S.sp-=dt;
  if(BK){S.v=Math.max(0,S.v-(26+S.v*.7)*dt)}else{var tg=TR.maxV*(S.tb>0?1.45:S.sp>0?1.18:.6),kk2=S.tb>0?1.3:S.sp>0?1:(S.v<tg?.5:.16);S.v+=(tg-S.v)*Math.min(1,dt*kk2)}
  if(Math.abs(S.lat)>HW-.8)S.v*=1-dt*1.1;
  S.vl+=(-inp*(10+P.ag)*Math.min(1,.2+S.v/10)-S.vl)*dt*6;
  S.lat+=(S.vl-p.c*Math.pow(Math.min(S.v,TR.maxV),2)*.15*(1-.08*P.ag))*dt;
  if(Math.abs(S.lat)>HW+1.6){S.lat=Math.sign(S.lat)*(HW+1.6);S.v*=.97;S.sh=Math.max(S.sh,.3)}
  S.s+=S.v*dt;S.t-=dt;
  TR.cars.forEach(function(c){c.s+=c.v*dt;c.cd-=dt;
    if(!c.dead&&c.cd<=0&&Math.abs(c.s-S.s)<4.2&&Math.abs(c.lat-S.lat)<1.9){c.cd=1.5;if(S.shd){S.shd=0;S.sh=.35;flash('ESCUDO ABSORVEU O IMPACTO!',1200);hudI()}else{S.crash=1}}});
  if(S.crash){S.crash=0;S.sh=1;end(false,'crash');return}
  if(S.mgo)TR.orbs.forEach(function(o){if(!o.got){var d0=o.s-S.s;if(d0>-6&&d0<55&&Math.abs(o.lat-S.lat)<12){var k=Math.min(1,dt*(o.sp?4:3));o.s+=(S.s-o.s)*k;o.lat+=(S.lat-o.lat)*k}}});
  TR.orbs.forEach(function(o){if(!o.got&&Math.abs(o.s-S.s)<(o.sp?3.8:3)&&Math.abs(o.lat-S.lat)<(o.sp?2.8:2.4)){o.got=1;o.g.visible=false;if(o.sp){S.sp=6;S.t+=2;S.sh=Math.max(S.sh,.2);flash('ESFERA ESPECIAL! 6 s',1500)}else{S.orbs++;S.t+=1.5;S.tc=Math.min(6,S.tc+1);if(S.tc==6)flash('TURBO PRONTO!',1500)}}});
  if(S.s>=TR.L)end(true);else if(S.t<=0)end(false);
}
var hu=0,c1='',c2='',c3=-1,fa0=0,fn=0,tm=0,last=performance.now(),cp=new T.Vector3(),ct=new T.Vector3(),bar=document.querySelector('#bar i');
function frame(now){

  if(tm>3){fn++;fa0+=dt;if(fn>=40){var av=fa0/fn;fn=0;fa0=0;if(av>.036&&PR>.8){PR=Math.max(.8,PR-.1);rd.setPixelRatio(PR);resize()}}}

  wh.forEach(function(w){w.rotation.x+=S.v*dt/.37});flm.forEach(function(f,i){var k=.5+Math.min(1.7,S.v/(TR.maxV||40))*.9+.25*Math.sin(tm*40+i*2);f.scale.set(k,k,1)});tailM.emissiveIntensity=(S.sh>.3||BK)?6:2.6;
  glowP.scale.setScalar(1+.06*Math.sin(tm*5)+(S.tb>0?.5:S.sp>0?.3:0));shM.visible=!!S.shd&&!!S.play;shM.material.opacity=.2+.1*Math.sin(tm*6);
  TR.cars.forEach(function(c){var v=!c.dead&&Math.abs(c.s-S.s)<260;c.g.visible=v;if(v)put(c.g,c.s,c.lat,.02)});
  TR.orbs.forEach(function(o){var v=!o.got&&Math.abs(o.s-S.s)<330;o.g.visible=v;if(v){put(o.g,o.s,o.lat,1.2+.25*Math.sin(tm*3+o.s));if(o.sp)o.g.children[0].rotation.y+=dt*3}});
  var dx=Math.sin(p.h),dz=Math.cos(p.h);

    cam.lookAt(car.position.x+dx*14,car.position.y+1,car.position.z+dz*14);
    var nf=Math.min(86,60+S.v*.3);if(Math.abs(nf-cam.fov)>.4){cam.fov=nf;cam.updateProjectionMatrix()}

  }else{
    var a=tm*.45,rr=(7+1.8*Math.sin(tm*.4))*Math.max(1,.62/cam.aspect);ct.set(car.position.x+Math.sin(a)*rr,car.position.y+1.5+1.1*(1+Math.sin(tm*.3)),car.position.z+Math.cos(a)*rr);
    if(ov.className=='in'){var ci=Math.floor(tm/3.2)%6;bodyM.color.lerp(tcl.set(PAL[ci][0]),.05);auraM.color.lerp(tcl2.set(PAL[ci][1]),.05);fm.color.lerp(tcl2,.05)}
    cam.position.lerp(ct,1-Math.exp(-dt*4));cam.lookAt(car.position.x,car.position.y+.9,car.position.z);
    if(cam.fov!=62){cam.fov=62;cam.updateProjectionMatrix()}bar.style.width='0';
  }
  fx.position.copy(car.position);fx.rotation.y=p.h;
  var fa=fg.attributes.position;for(var i=0;i<240;i++){var z=fa.getZ(i)-S.v*dt*1.2;if(z<-40)z+=110;fa.setZ(i,z)}fa.needsUpdate=true;
  sunS.position.set(cam.position.x+Math.sin(TR.sa)*1500,cam.position.y+260,cam.position.z+Math.cos(TR.sa)*1500);
  stars.position.copy(cam.position);camL.position.copy(cam.position);camL.target.position.copy(car.position);camL.target.updateMatrixWorld();stage.visible=!S.play;stage.position.set(car.position.x,car.position.y-.035,car.position.z);stage.rotation.y+=dt*.4;sAcc.color.copy(auraM.color);bm.color.copy(auraM.color);

}
menu();cam.position.set(0,5,-10);

})();
