<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anúncio – Desafio MOZ</title>
  <meta name="theme-color" content="#06080e">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;600&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;background:#06080e;color:#F4F6FB;
      font-family:'Inter',system-ui,sans-serif;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:16px;position:relative;overflow-x:hidden;
    }
    body::before{
      content:'';position:fixed;inset:-20%;pointer-events:none;filter:blur(50px);z-index:0;
      background:
        radial-gradient(circle at 30% 20%,rgba(168,85,247,.35),transparent 42%),
        radial-gradient(circle at 70% 80%,rgba(34,255,153,.22),transparent 40%),
        radial-gradient(circle at 50% 50%,rgba(255,201,77,.12),transparent 45%);
    }
    .box{
      position:relative;z-index:1;width:100%;max-width:440px;
      background:linear-gradient(160deg,rgba(28,34,48,.98),rgba(12,16,26,.98));
      border:1px solid rgba(168,85,247,.45);border-radius:22px;overflow:hidden;
      box-shadow:0 0 48px rgba(168,85,247,.3),0 16px 40px rgba(0,0,0,.45);
    }
    .topo{
      text-align:center;padding:16px 14px 10px;
    }
    .tag{
      display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
      color:#04140a;background:linear-gradient(90deg,#FFC94D,#22FF99);
      padding:5px 12px;border-radius:99px;margin-bottom:10px;
      box-shadow:0 0 16px rgba(255,201,77,.4);
    }
    h1{
      font-family:'Sora',sans-serif;font-size:17px;font-weight:800;line-height:1.3;margin-bottom:6px;
      background:linear-gradient(90deg,#fff,#a855f7,#FFC94D);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .sub{font-size:12.5px;color:#8E9BB8;line-height:1.45}
    .video-wrap{
      position:relative;width:100%;padding-bottom:56.25%;height:0;background:#000;
    }
    .video-wrap iframe,.video-wrap #yt-player{
      position:absolute;inset:0;width:100%;height:100%;border:0;
    }
    .status{
      text-align:center;padding:12px 14px;font-size:13px;color:#22FF99;font-weight:600;
      min-height:44px;
    }
    .status.fim{color:#FFC94D}
    .acoes{padding:0 14px 16px;display:flex;flex-direction:column;gap:10px}
    .btn-curso{
      display:block;text-align:center;text-decoration:none;padding:13px 14px;border-radius:14px;
      font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:#04140a;
      background:linear-gradient(90deg,#22FF99,#FFC94D);
      box-shadow:0 0 22px rgba(34,255,153,.35);
    }
    .btn-continuar{
      display:none;width:100%;border:none;border-radius:14px;padding:14px;
      font-family:'Sora',sans-serif;font-weight:800;font-size:14px;cursor:pointer;
      color:#fff;background:linear-gradient(90deg,#a855f7,#3b9eff);
      box-shadow:0 0 24px rgba(168,85,247,.4);
      animation:pulse 1.6s ease-in-out infinite;
    }
    .btn-continuar.show{display:block}
    @keyframes pulse{
      0%,100%{transform:scale(1);box-shadow:0 0 24px rgba(168,85,247,.35)}
      50%{transform:scale(1.03);box-shadow:0 0 36px rgba(168,85,247,.55)}
    }
    .hint{font-size:11px;color:#666;text-align:center;padding:0 14px 14px}
  </style>
</head>
<body>
  <div class="box">
    <div class="topo">
      <span class="tag">Anúncio</span>
      <h1>A equipa cria o site para ti · ou cria tu mesmo</h1>
      <p class="sub">Vê o anúncio até ao fim. Depois entras em <b style="color:#22FF99">Aumenta os teus ganhos</b>.</p>
    </div>
    <div class="video-wrap">
      <div id="yt-player"></div>
    </div>
    <div class="status" id="status">A carregar o anúncio…</div>
    <div class="acoes">
      <a class="btn-curso" href="https://desafiomoz.pages.dev/Curso%20de%20site/index.html" target="_blank" rel="noopener">
        <i class="fas fa-external-link-alt"></i> Clica aqui — curso / encomendar site
      </a>
      <button type="button" class="btn-continuar" id="btn-continuar" onclick="irAumento()">
        Continuar para Aumenta os teus ganhos →
      </button>
    </div>
    <p class="hint" id="hint">O botão de continuar aparece quando o anúncio terminar.</p>
  </div>

  <script>
    var DESTINO = 'aumento-ganhos.html';
    var VIDEO_ID = 'M5ruuiihjqc';
    var player = null;
    var acabou = false;

    function irAumento() {
      window.location.href = DESTINO;
    }

    function liberarContinuar() {
      if (acabou) return;
      acabou = true;
      var st = document.getElementById('status');
      st.textContent = 'Anúncio concluído! Podes continuar.';
      st.classList.add('fim');
      document.getElementById('btn-continuar').classList.add('show');
      document.getElementById('hint').textContent = 'Toca em Continuar para ver o check-in e os pacotes.';
      // Redireciona sozinho após 2s (opcional suave)
      setTimeout(function () {
        if (document.visibilityState !== 'hidden') {
          // não força se o user ainda está a ler o botão do curso
        }
      }, 2000);
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: VIDEO_ID,
        playerVars: {
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          autoplay: 1,
          controls: 1
        },
        events: {
          onReady: function (e) {
            document.getElementById('status').textContent = 'A reproduzir o anúncio… vê até ao fim.';
            try { e.target.playVideo(); } catch (err) {}
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) {
              liberarContinuar();
              // redireciona automaticamente 1.5s depois do fim
              setTimeout(irAumento, 1500);
            } else if (e.data === YT.PlayerState.PLAYING) {
              document.getElementById('status').textContent = 'A reproduzir o anúncio… vê até ao fim.';
            }
          },
          onError: function () {
            document.getElementById('status').textContent = 'Não foi possível carregar o vídeo. Continua mesmo assim.';
            liberarContinuar();
          }
        }
      });
    }

    // Fallback se a API falhar ou o user não puder ver vídeo
    setTimeout(function () {
      if (!acabou) {
        document.getElementById('hint').textContent = 'Se o vídeo não carregar, usa o botão Continuar.';
        document.getElementById('btn-continuar').classList.add('show');
      }
    }, 45000);

    // Carrega API YouTube
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  </script>
</body>
</html>
