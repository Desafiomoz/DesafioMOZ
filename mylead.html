<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyLead – Desafio MOZ</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
    <meta name="theme-color" content="#06080e">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --preto-fundo: #0e1118;
            --verde: #00C853;
            --verde-claro: #22FF99;
            --texto: #FFFFFF;
            --texto-claro: #A8B0C8;
            --card: rgba(24, 28, 40, 0.95);
            --linha: rgba(0,200,83,0.22);
        }
        body {
            background:
                radial-gradient(circle at 15% 0%, rgba(0,200,83,0.12), transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(255,201,77,0.07), transparent 35%),
                var(--preto-fundo);
            color: var(--texto);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 14px 12px 90px;
        }
        .menu-baixo {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(12, 14, 20, 0.97);
            border-top: 1px solid #1e2430;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 12px;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        .menu-baixo a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #777;
            font-size: 11px;
            font-weight: 500;
            width: 70px;
        }
        .menu-baixo a i { font-size: 20px; }
        .menu-baixo a.ativo { color: var(--verde-claro); }

        .topo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 12px 14px;
            background: rgba(18, 22, 32, 0.95);
            border: 1px solid var(--linha);
            border-radius: 16px;
        }
        .topo a.voltar {
            color: var(--verde-claro);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .topo .logo-mini {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: #fff;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(0,200,83,0.3);
        }
        .topo .logo-mini img {
            width: 100%; height: 100%;
            object-fit: contain;
            padding: 3px;
        }
        .topo h1 { font-size: 16px; font-weight: 700; }
        .topo p {
            font-size: 11.5px;
            color: var(--texto-claro);
            margin-top: 2px;
        }

        .aviso {
            background: var(--card);
            border: 1px solid var(--linha);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            font-size: 12.5px;
            color: var(--texto-claro);
            line-height: 1.5;
        }
        .aviso b { color: var(--verde-claro); }
        .aviso.erro-box {
            border-color: rgba(255,80,80,0.4);
            color: #ffb4b4;
        }

        .btn-abrir {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 12px;
            padding: 13px 16px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            color: #04140a;
            background: linear-gradient(135deg, #22FF99 0%, #00C853 55%, #00a844 100%);
            box-shadow: 0 6px 18px rgba(0,200,83,0.35);
        }

        .estado {
            text-align: center;
            padding: 20px 12px;
            color: var(--texto-claro);
            font-size: 13px;
        }
        .spinner {
            width: 34px; height: 34px;
            margin: 0 auto 12px;
            border: 3px solid rgba(0,200,83,0.2);
            border-top-color: var(--verde);
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="topo">
        <a class="voltar" href="ofertas.html">← Voltar</a>
        <div class="logo-mini">
            <img src="https://i.supaimg.com/9447b725-0914-4700-9681-fccbd9cb5399/f96292ac-9b0f-4e16-bd5c-7b260ed43da5.jpg" alt="MyLead">
        </div>
        <div>
            <h1>MyLead</h1>
            <p>Ofertas, jogos e cupões — ganhe pontos</p>
        </div>
    </div>

    <div class="aviso">
        Complete a oferta até ao fim. Os pontos entram <b>automaticamente</b> na sua conta (pode demorar alguns minutos).
    </div>

    <div class="estado" id="estado">
        <div class="spinner"></div>
        A preparar as ofertas...
    </div>

    <a id="btnAbrir" class="btn-abrir" href="#" target="_blank" rel="noopener">
        <i class="fas fa-external-link-alt"></i>
        Abrir ofertas MyLead
    </a>

    <div class="aviso" id="avisoExtra" style="display:none;"></div>

    <script>
        (async function () {
            var estado = document.getElementById('estado');
            var btnAbrir = document.getElementById('btnAbrir');
            var avisoExtra = document.getElementById('avisoExtra');

            var email = (
                localStorage.getItem('emailUtilizador') ||
                localStorage.getItem('email') ||
                localStorage.getItem('userEmail') ||
                localStorage.getItem('user_email') ||
                ''
            ).trim().toLowerCase();

            if (!email) {
                estado.innerHTML =
                    'Precisa de entrar na conta para ver as ofertas.<br><br>' +
                    '<a href="criar-conta.html" style="color:var(--verde-claro);font-weight:600;">Entrar / Criar conta</a>';
                return;
            }

            function gerarUUID() {
                if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            var playerId = localStorage.getItem('myleadPlayerId');
            if (!playerId) {
                playerId = gerarUUID();
                localStorage.setItem('myleadPlayerId', playerId);
            }

            var FIREBASE_PROJECT_ID = 'desafio-moz-61b70';
            var FIRESTORE_BASE = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents';
            var docUrl = FIRESTORE_BASE + '/myleadPlayers/' + encodeURIComponent(playerId) +
                '?documentId=' + encodeURIComponent(playerId);

            var gravou = false;
            try {
                var res = await fetch(docUrl, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            email: { stringValue: email },
                            updatedAt: { timestampValue: new Date().toISOString() }
                        }
                    })
                });
                gravou = res.ok || res.status === 200 || res.status === 201;

                // Confirmar leitura
                if (gravou) {
                    var check = await fetch(FIRESTORE_BASE + '/myleadPlayers/' + encodeURIComponent(playerId));
                    if (check.status === 200) {
                        var data = await check.json();
                        var emailGuardado = data?.fields?.email?.stringValue || '';
                        gravou = emailGuardado.toLowerCase() === email;
                    } else {
                        gravou = false;
                    }
                }
            } catch (e) {
                gravou = false;
            }

            // Plano B: se Firestore bloquear, usa o email directamente no player_id
            var idParaMyLead = playerId;
            if (!gravou) {
                idParaMyLead = email;
                avisoExtra.style.display = 'block';
                avisoExtra.className = 'aviso';
                avisoExtra.innerHTML =
                    'Modo alternativo activo: a MyLead vai usar o seu email como ID. ' +
                    'Os pontos devem continuar a funcionar.';
            }

            var wallUrl =
                'https://reward-me.eu/beedda9e-989e-11f1-b19e-8a5fb7be40ea?player_id=' +
                encodeURIComponent(idParaMyLead);

            btnAbrir.href = wallUrl;
            btnAbrir.style.display = 'flex';
            estado.style.display = 'none';

            if (gravou) {
                avisoExtra.style.display = 'block';
                avisoExtra.innerHTML =
                    'Conta ligada. Toque no botão verde para abrir as ofertas MyLead.';
            }
        })();
    </script>

    <div class="menu-baixo">
        <a href="desafios.html"><i class="fas fa-home"></i> Início</a>
        <a href="tarefas.html"><i class="fas fa-tasks"></i> Tarefas</a>
        <a href="saques.html"><i class="fas fa-wallet"></i> Sacar</a>
        <a href="ofertas.html" class="ativo"><i class="fas fa-gift"></i> Ofertas</a>
        <a href="perfil.html"><i class="fas fa-cog"></i> Conta</a>
    </div>

</body>
</html>
