<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #07080d;
      --verde: #00c853;
      --verde-vivo: #22ff99;
      --ouro: #ffc94d;
      --texto: #f4f6fb;
      --suave: #8e9bb8;
      --painel: rgba(18, 22, 31, 0.82);
    }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--texto);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(circle at 20% 15%, rgba(0,200,83,0.22), transparent 42%),
        radial-gradient(circle at 85% 10%, rgba(255,201,77,0.12), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(34,255,153,0.08), transparent 45%),
        #07080d;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.35;
      pointer-events: none;
    }

    .shell {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    /* Aura ring around card */
    .shell::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(0,200,83,0.55), rgba(255,201,77,0.25), rgba(34,255,153,0.45));
      z-index: 0;
      filter: blur(0.5px);
      opacity: 0.85;
    }
    .shell::after {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 36px;
      background: radial-gradient(circle at 50% 40%, rgba(0,200,83,0.28), transparent 65%);
      z-index: -1;
      filter: blur(18px);
      animation: auraPulse 4s ease-in-out infinite;
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.03); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--painel);
      backdrop-filter: blur(18px);
      border-radius: 26px;
      padding: 32px 26px 28px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }

    .topo {
      text-align: center;
      margin-bottom: 22px;
    }
    .logo-wrap {
      width: 96px; height: 96px;
      margin: 0 auto 14px;
      border-radius: 24px;
      padding: 3px;
      background: linear-gradient(145deg, var(--verde-vivo), var(--ouro), var(--verde));
      box-shadow: 0 0 32px rgba(34,255,153,0.35);
      animation: logoGlow 3s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 0 22px rgba(34,255,153,0.3); }
      50% { box-shadow: 0 0 40px rgba(34,255,153,0.55); }
    }
    .logo-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 21px;
      background: #0c1018;
      display: block;
    }
    .topo h1 {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .topo h1 span {
      background: linear-gradient(90deg, var(--verde-vivo), var(--ouro));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .topo p { color: var(--suave); font-size: 14px; }

    .abas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(5,8,14,0.75);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 20px;
    }
    .aba {
      text-align: center;
      padding: 12px 8px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      color: var(--suave);
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }
    .aba.ativa {
      background: linear-gradient(90deg, var(--verde), var(--verde-vivo));
      color: #04140a;
      box-shadow: 0 6px 18px rgba(0,200,83,0.3);
    }

    .aviso-erro {
      display: none;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      color: #ff6b6b;
      background: rgba(255,77,77,0.1);
      border: 1px solid rgba(255,77,77,0.28);
    }
    .aviso-erro.mostra { display: block; }
    .aviso-erro.sucesso {
      color: var(--verde-vivo);
      background: rgba(0,200,83,0.1);
      border-color: rgba(0,200,83,0.3);
    }

    .formulario { display: none; }
    .formulario.ativo { display: block; animation: sobe 0.3s ease; }
    @keyframes sobe {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-google {
      width: 100%;
      padding: 13px;
      background: #fff;
      color: #111;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-google:active { transform: scale(0.98); }

    .divisor {
      text-align: center;
      color: var(--suave);
      font-size: 12px;
      margin: 14px 0 16px;
      position: relative;
    }
    .divisor::before, .divisor::after {
      content: '';
      position: absolute; top: 50%;
      width: 38%; height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .divisor::before { left: 0; }
    .divisor::after { right: 0; }

    .grupo-input { margin-bottom: 14px; }
    .grupo-input label {
      display: block;
      color: var(--verde-vivo);
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .grupo-input input {
      width: 100%;
      padding: 13px 14px;
      background: rgba(5,8,14,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: var(--texto);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .grupo-input input:focus {
      border-color: rgba(34,255,153,0.55);
      box-shadow: 0 0 0 3px rgba(0,200,83,0.12);
    }
    .grupo-input input::placeholder { color: #5a6478; }

    .senha-wrap { position: relative; }
    .senha-wrap input { padding-right: 46px; }
    .btn-olho {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--suave);
      font-size: 16px; cursor: pointer; padding: 6px;
    }
    .btn-olho:hover { color: var(--verde-vivo); }

    .btn-principal {
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      color: #04140a;
      background: linear-gradient(90deg, var(--verde), var(--verde-vivo));
      box-shadow: 0 8px 24px rgba(0,200,83,0.35);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-principal:hover { box-shadow: 0 12px 30px rgba(0,200,83,0.45); }
    .btn-principal:active { transform: scale(0.98); }
    .btn-principal:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

    .link-ajuda {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--suave);
    }
    .link-ajuda a {
      color: var(--verde-vivo);
      text-decoration: none;
      font-weight: 600;
    }

    .selo-rodape {
      text-align: center;
      margin-top: 18px;
      font-size: 11px;
      color: #5a6478;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

<div class="shell">
  <div class="card">
    <div class="topo">
      <div class="logo-wrap">
        <img src="https://i.supaimg.com/b173afd9-4344-4026-a5d7-6a53e4b6efdc/8f054a24-2746-4a43-9f1c-354584289dc3.png" alt="Desafio MOZ">
      </div>
      <h1>Bem-vindo ao <span>Desafio MOZ</span></h1>
      <p>Entra ou cria conta e começa a ganhar</p>
    </div>

    <div class="abas">
      <div class="aba" id="aba-login" onclick="mostrarFormulario('login')">Login</div>
      <div class="aba ativa" id="aba-cadastro" onclick="mostrarFormulario('cadastro')">Cadastro</div>
    </div>

    <div class="aviso-erro" id="aviso-campo"></div>

    <form class="formulario" id="form-login">
      <a href="#" class="btn-google" onclick="entrarComGoogle(); return false;">
        <i class="fab fa-google"></i> Entrar com Google
      </a>
      <div class="divisor">ou</div>
      <div class="grupo-input">
        <label>E-mail</label>
        <input type="email" id="email-login" placeholder="seuemail@gmail.com" autocomplete="email">
      </div>
      <div class="grupo-input">
        <label>Senha</label>
        <div class="senha-wrap">
          <input type="password" id="senha-login" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="btn-olho" onclick="toggleSenha('senha-login', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-principal" id="btn-login">Entrar</button>
      <div class="link-ajuda"><a href="contato.html">Esqueceu a senha?</a></div>
    </form>

    <form class="formulario ativo" id="form-cadastro">
      <a href="#" class="btn-google" onclick="entrarComGoogle(); return false;">
        <i class="fab fa-google"></i> Cadastrar com Google
      </a>
      <div class="divisor">ou preencha os dados</div>
      <div class="grupo-input">
        <label>Nome completo</label>
        <input type="text" id="nome-cadastro" placeholder="O seu nome completo" autocomplete="name">
      </div>
      <div class="grupo-input">
        <label>Telemóvel (M-Pesa / e-Mola)</label>
        <input type="tel" id="telemovel-cadastro" placeholder="+258 8X XXX XXXX" autocomplete="tel">
      </div>
      <div class="grupo-input">
        <label>E-mail</label>
        <input type="email" id="email-cadastro" placeholder="seuemail@gmail.com" autocomplete="email">
      </div>
      <div class="grupo-input">
        <label>Criar senha</label>
        <div class="senha-wrap">
          <input type="password" id="senha-cadastro" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          <button type="button" class="btn-olho" onclick="toggleSenha('senha-cadastro', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-principal" id="btn-cadastro">Criar a minha conta</button>
    </form>

    <div class="selo-rodape">Desafio MOZ · Moçambique</div>
  </div>
</div>

<script>
  var aviso = document.getElementById('aviso-campo');

  (function guardarRefDoLink() {
    try {
      var params = new URLSearchParams(window.location.search);
      var ref = params.get('ref');
      if (ref) localStorage.setItem('refPendente', ref.trim().toUpperCase());
    } catch (e) {}
  })();

  function mostrarAviso(texto, tipo) {
    aviso.innerHTML = texto;
    aviso.className = 'aviso-erro';
    if (tipo === 'sucesso') aviso.classList.add('sucesso');
    aviso.classList.add('mostra');
    setTimeout(function () { aviso.classList.remove('mostra'); }, 5000);
  }

  function mostrarFormulario(tipo) {
    aviso.classList.remove('mostra');
    if (tipo === 'login') {
      document.getElementById('form-login').classList.add('ativo');
      document.getElementById('form-cadastro').classList.remove('ativo');
      document.getElementById('aba-login').classList.add('ativa');
      document.getElementById('aba-cadastro').classList.remove('ativa');
    } else {
      document.getElementById('form-cadastro').classList.add('ativo');
      document.getElementById('form-login').classList.remove('ativo');
      document.getElementById('aba-cadastro').classList.add('ativa');
      document.getElementById('aba-login').classList.remove('ativa');
    }
  }

  function toggleSenha(inputId, btn) {
    var input = document.getElementById(inputId);
    var icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  function mensagemPermissao(erro) {
    var msg = (erro && erro.message) ? erro.message : String(erro);
    if (msg.indexOf('permission') !== -1 || msg.indexOf('Permission') !== -1 || msg.indexOf('insufficient') !== -1) {
      return '❌ Sem permissão no Firebase.<br>Abra o Firebase Console → Firestore → Regras.';
    }
    return '❌ Erro: ' + msg;
  }

  // Transforma a senha num código embaralhado (SHA-256) antes de guardar/comparar.
  async function hashSenha(texto) {
    var encoder = new TextEncoder();
    var dados = encoder.encode(texto);
    var hashBuffer = await crypto.subtle.digest('SHA-256', dados);
    var hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function hashCode(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  }

  // ENTRAR / CADASTRAR COM GOOGLE — cria o utilizador em "usuarios" se ainda não existir
  async function entrarComGoogle() {
    try {
      var provider = new firebase.auth.GoogleAuthProvider();
      var resultado = await authGoogle.signInWithPopup(provider);
      var googleUser = resultado.user;
      var email = (googleUser.email || '').trim().toLowerCase();
      if (!email) return mostrarAviso('⚠️ Não foi possível obter o e-mail da conta Google.');

      var procura = await db.collection('usuarios').where('email', '==', email).limit(1).get();
      var usuario;

      if (procura.empty) {
        // Utilizador novo — cria o registo em "usuarios", igual ao cadastro normal.
        var meuCodigo = 'MOZ' + hashCode(email).toString(36).toUpperCase().substring(0, 8);
        var dadosNovo = {
          nome: googleUser.displayName || 'Utilizador Google',
          telemovel: googleUser.phoneNumber || '',
          email: email,
          senha: null,
          loginGoogle: true,
          pontos: 0,
          pesquisaDadosCompleta: false,
          pesquisaRapidaCompleta: false,
          pesquisaOpiniaoCompleta: false,
          pesquisaHabitosCompleta: false,
          codigoIndicacao: meuCodigo,
          criadoEm: new Date().toISOString()
        };
        var novoRef = await db.collection('usuarios').add(dadosNovo);
        usuario = dadosNovo;
      } else {
        usuario = procura.docs[0].data();
      }

      localStorage.setItem('nomeUtilizador', usuario.nome || '');
      localStorage.setItem('telUtilizador', usuario.telemovel || '');
      localStorage.setItem('emailUtilizador', usuario.email || email);
      localStorage.setItem('pontosUtilizador', String(usuario.pontos || 0));
      localStorage.setItem('pesquisaDadosCompleta', usuario.pesquisaDadosCompleta ? 'true' : 'false');
      localStorage.setItem('pesquisaRapidaCompleta', usuario.pesquisaRapidaCompleta ? 'true' : 'false');
      localStorage.setItem('pesquisaOpiniaoCompleta', usuario.pesquisaOpiniaoCompleta ? 'true' : 'false');
      localStorage.setItem('pesquisaHabitosCompleta', usuario.pesquisaHabitosCompleta ? 'true' : 'false');
      if (usuario.codigoIndicacao) localStorage.setItem('codigoIndicacao', usuario.codigoIndicacao);

      mostrarAviso('✅ Entrando com Google...', 'sucesso');
      setTimeout(function () { window.location.href = 'desafios.html'; }, 1000);
    } catch (erro) {
      console.error(erro);
      if (erro.code === 'auth/popup-closed-by-user') return;
      mostrarAviso('❌ Erro ao entrar com Google: ' + (erro.message || erro));
    }
  }

  // LOGIN – carrega só as pesquisas DESTA conta
  document.getElementById('form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email-login').value.trim().toLowerCase();
    var senha = document.getElementById('senha-login').value;
    var btn = document.getElementById('btn-login');
    if (!email || !senha) return mostrarAviso('⚠️ Preencha todos os campos!');
    btn.disabled = true;
    btn.textContent = 'A entrar...';
    try {
      var senhaHash = await hashSenha(senha);
      var procura = await db.collection('usuarios')
        .where('email', '==', email)
        .where('senha', '==', senhaHash)
        .limit(1).get();

      var precisaMigrar = false;
      if (procura.empty) {
        // Conta antiga (senha ainda em texto puro) — tenta com a senha "crua" e migra.
        procura = await db.collection('usuarios')
          .where('email', '==', email)
          .where('senha', '==', senha)
          .limit(1).get();
        precisaMigrar = !procura.empty;
      }

      if (procura.empty) {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return mostrarAviso('⚠️ E-mail ou senha inválidos!');
      }
      var usuario = procura.docs[0].data();

      if (precisaMigrar) {
        try { await procura.docs[0].ref.update({ senha: senhaHash }); } catch (eMig) { console.error(eMig); }
      }

      localStorage.setItem('nomeUtilizador', usuario.nome || '');
      localStorage.setItem('telUtilizador', usuario.telemovel || '');
      localStorage.setItem('emailUtilizador', usuario.email || email);
      localStorage.setItem('pontosUtilizador', String(usuario.pontos || 0));
      localStorage.setItem('pesquisaDadosCompleta', usuario.pesquisaDadosCompleta ? 'true' : 'false');
      localStorage.setItem('pesquisaRapidaCompleta', usuario.pesquisaRapidaCompleta ? 'true' : 'false');
      localStorage.setItem('pesquisaOpiniaoCompleta', usuario.pesquisaOpiniaoCompleta ? 'true' : 'false');
      localStorage.setItem('pesquisaHabitosCompleta', usuario.pesquisaHabitosCompleta ? 'true' : 'false');
      if (usuario.codigoIndicacao) localStorage.setItem('codigoIndicacao', usuario.codigoIndicacao);
      mostrarAviso('✅ Entrando...', 'sucesso');
      setTimeout(function () { window.location.href = 'desafios.html'; }, 1000);
    } catch (erro) {
      console.error(erro);
      mostrarAviso(mensagemPermissao(erro));
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });

  // CADASTRO – todas as pesquisas disponíveis
  document.getElementById('form-cadastro').addEventListener('submit', async function (e) {
    e.preventDefault();
    var nome = document.getElementById('nome-cadastro').value.trim();
    var telemovel = document.getElementById('telemovel-cadastro').value.trim();
    var email = document.getElementById('email-cadastro').value.trim().toLowerCase();
    var senha = document.getElementById('senha-cadastro').value;
    var btn = document.getElementById('btn-cadastro');
    if (!nome || !telemovel || !email || !senha) return mostrarAviso('⚠️ Preencha todos os campos!');
    if (senha.length < 6) return mostrarAviso('⚠️ Senha deve ter pelo menos 6 caracteres!');
    btn.disabled = true;
    btn.textContent = 'A processar...';
    mostrarAviso('⏳ A processar...', 'sucesso');
    try {
      var telExiste = await db.collection('usuarios').where('telemovel', '==', telemovel).limit(1).get();
      var emailExiste = await db.collection('usuarios').where('email', '==', email).limit(1).get();
      if (!telExiste.empty || !emailExiste.empty) {
        btn.disabled = false;
        btn.textContent = 'Criar Minha Conta';
        return mostrarAviso('⚠️ Este número ou e-mail já está cadastrado!');
      }
      var params = new URLSearchParams(window.location.search);
      var refCodigo = (params.get('ref') || localStorage.getItem('refPendente') || '').trim().toUpperCase();
      var meuCodigo = 'MOZ' + hashCode(email).toString(36).toUpperCase().substring(0, 8);
      var senhaHash = await hashSenha(senha);
      var dadosNovo = {
        nome: nome, telemovel: telemovel, email: email, senha: senhaHash,
        pontos: refCodigo ? 5 : 0, status: 'Ativo',
        pesquisaDadosCompleta: false,
        pesquisaRapidaCompleta: false,
        pesquisaOpiniaoCompleta: false,
        pesquisaHabitosCompleta: false,
        codigoIndicacao: meuCodigo, totalConvidados: 0, pontosIndicacao: 0,
        dataCadastro: new Date().toISOString()
      };
      if (refCodigo) dadosNovo.indicadoPor = refCodigo;
      await db.collection('usuarios').add(dadosNovo);
      if (refCodigo) {
        try {
          var indSnap = await db.collection('usuarios').where('codigoIndicacao', '==', refCodigo).limit(1).get();
          if (!indSnap.empty) {
            var indRef = indSnap.docs[0].ref;
            var indData = indSnap.docs[0].data();
            if ((indData.email || '').toLowerCase() !== email) {
              var novoTotal = (indData.totalConvidados || 0) + 1;
              var updInd = {
                pontos: (indData.pontos || 0) + 10,
                totalConvidados: novoTotal,
                pontosIndicacao: (indData.pontosIndicacao || 0) + 10,
                ultimaAtualizacao: new Date().toISOString()
              };
              // Limite de 5 convites: bloqueia automaticamente
              if (novoTotal >= 5) {
                updInd.ocultarConvidar = true;
                updInd.convitesExtra = false;
              }
              await indRef.update(updInd);
            }
          }
        } catch (eInd) { console.error(eInd); }
        localStorage.removeItem('refPendente');
      }
      localStorage.setItem('nomeUtilizador', nome);
      localStorage.setItem('telUtilizador', telemovel);
      localStorage.setItem('emailUtilizador', email);
      localStorage.setItem('pontosUtilizador', String(dadosNovo.pontos));
      localStorage.setItem('pesquisaDadosCompleta', 'false');
      localStorage.setItem('pesquisaRapidaCompleta', 'false');
      localStorage.setItem('pesquisaOpiniaoCompleta', 'false');
      localStorage.setItem('pesquisaHabitosCompleta', 'false');
      localStorage.setItem('codigoIndicacao', meuCodigo);
      mostrarAviso('✅ Conta criada com sucesso!', 'sucesso');
      setTimeout(function () { window.location.href = 'desafios.html'; }, 1200);
    } catch (erro) {
      console.error(erro);
      mostrarAviso(mensagemPermissao(erro));
      btn.disabled = false;
      btn.textContent = 'Criar Minha Conta';
    }
  });
</script>
</body>
</html>
